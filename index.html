<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MERKEZ KANTİN - Dijital Menü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #ffffff;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .menu-container { max-width: 480px; width: 100%; margin: 0 auto; }
        
        /* ===== İSİM MODAL ===== */
        .name-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(15px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }
        .name-overlay.hidden { display: none; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        .name-modal {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 28px;
            padding: 48px 36px;
            max-width: 400px;
            width: 92%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }
        .name-modal .name-icon { font-size: 4rem; margin-bottom: 16px; display: block; }
        .name-modal h2 {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff6b35, #e53935);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .name-modal p {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .name-modal input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
            outline: none;
            transition: 0.3s;
        }
        .name-modal input:focus { border-color: #ff6b35; background: rgba(255,255,255,0.06); }
        .name-modal input::placeholder { color: #666; }
        .name-modal .name-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff6b35, #e53935);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .name-modal .name-btn:hover { transform: scale(1.02); box-shadow: 0 4px 30px rgba(229,57,53,0.4); }
        .name-modal .name-btn:active { transform: scale(0.97); }
        .name-modal .name-error {
            color: #e53935;
            font-size: 0.8rem;
            margin-top: 8px;
            display: none;
            background: rgba(229,57,53,0.1);
            padding: 8px 12px;
            border-radius: 8px;
        }
        .name-modal .name-error.show { display: block; }
        
        .menu-content { display: none; }
        .menu-content.show { display: block; }
        
        /* ===== BAŞLIK ===== */
        .restaurant-header {
            text-align: center;
            padding: 16px 0 12px;
            border-bottom: 2px solid rgba(255,255,255,0.05);
            margin-bottom: 16px;
        }
        .restaurant-header .logo { font-size: 2.8rem; display: block; }
        .restaurant-header h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b35, #e53935);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .restaurant-header .info {
            font-size: 0.75rem;
            color: #999;
            margin-top: 4px;
        }
        .restaurant-header .info i { color: #ff6b35; }
        .restaurant-header .user-name {
            font-size: 0.7rem;
            color: #ff6b35;
            margin-top: 6px;
            background: rgba(255,255,255,0.03);
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
        }
        .restaurant-header .user-name i { margin-right: 4px; }
        
        /* ===== DİĞER STİLLER ===== */
        .badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 10px 0 16px;
        }
        .badges span {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.65rem;
            color: #aaa;
        }
        .badges span i { color: #ff6b35; margin-right: 4px; }
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 16px;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .category-btn {
            flex: 0 0 auto;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 8px 18px;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .category-btn i { margin-right: 5px; }
        .category-btn.active {
            background: linear-gradient(135deg, #ff6b35, #e53935);
            border-color: #e53935;
            color: #fff;
            box-shadow: 0 4px 20px rgba(229,57,53,0.3);
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }
        .menu-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            animation: fadeUp 0.3s ease forwards;
            opacity: 0;
            position: relative;
        }
        .menu-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(180deg, #ff6b35, #e53935);
            border-radius: 0 3px 3px 0;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .item-image {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .item-details { flex: 1; min-width: 0; }
        .item-details .item-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .item-details .item-name .badge {
            font-size: 0.45rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 1px 10px;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }
        .badge.popular { background: #ff6b35; color: #0a0a0a; }
        .badge.new { background: #00c853; color: #0a0a0a; }
        .badge.spicy { background: #d32f2f; color: #fff; }
        .badge.cold { background: #2196F3; color: #fff; }
        .badge.hot { background: #FF5722; color: #fff; }
        .badge.dessert { background: #9C27B0; color: #fff; }
        .item-details .item-desc {
            font-size: 0.7rem;
            color: #888;
            margin-top: 2px;
            line-height: 1.3;
        }
        .item-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }
        .item-price {
            font-weight: 800;
            font-size: 1rem;
            color: #ff6b35;
        }
        .item-price .currency { font-size: 0.7rem; color: #999; margin-right: 1px; }
        .cart-top-btn {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .cart-top-btn button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }
        .cart-top-btn button:hover { background: rgba(255,255,255,0.1); }
        .cart-top-btn button .cart-count {
            background: #e53935;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            padding: 2px;
        }
        .quantity-controls button {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quantity-controls button:hover { background: rgba(255,255,255,0.15); }
        .quantity-controls .qty-number {
            min-width: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .add-btn {
            background: linear-gradient(135deg, #ff6b35, #e53935);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(229,57,53,0.25);
        }
        .add-btn:active { transform: scale(0.85); }
        .add-btn.in-cart { background: #00c853; box-shadow: 0 4px 15px rgba(0,200,83,0.25); }
        .cart-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 999;
            justify-content: center;
            align-items: flex-end;
        }
        .cart-overlay.active { display: flex; }
        .cart-panel {
            background: #1a1a1a;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            padding: 20px 16px 30px;
            animation: slideUp 0.3s ease forwards;
            display: flex;
            flex-direction: column;
        }
        @keyframes slideUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0); }
        }
        .cart-panel .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .cart-panel .cart-header h2 { font-size: 1.2rem; font-weight: 700; }
        .cart-panel .cart-header h2 i { color: #ff6b35; margin-right: 8px; }
        .cart-panel .cart-header .close-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .cart-panel .cart-header .close-btn:hover { background: rgba(255,255,255,0.1); }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            padding-right: 4px;
        }
        .cart-items::-webkit-scrollbar { width: 3px; }
        .cart-items::-webkit-scrollbar-thumb { background: #e53935; border-radius: 10px; }
        .cart-items::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            animation: fadeUp 0.2s ease forwards;
            opacity: 0;
        }
        .cart-item .ci-icon { font-size: 1.6rem; width: 40px; text-align: center; }
        .cart-item .ci-info { flex: 1; }
        .cart-item .ci-info .ci-name { font-size: 0.85rem; font-weight: 600; }
        .cart-item .ci-info .ci-price { font-size: 0.75rem; color: #ff6b35; font-weight: 700; }
        .cart-item .ci-qty-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 2px;
        }
        .cart-item .ci-qty-controls button {
            background: rgba(255,255,255,0.06);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-item .ci-qty-controls button:hover { background: rgba(255,255,255,0.12); }
        .cart-item .ci-qty-controls .ci-qty-num {
            min-width: 18px;
            text-align: center;
            font-weight: 700;
            font-size: 0.8rem;
        }
        .cart-item .ci-remove {
            background: rgba(229,57,53,0.15);
            border: none;
            color: #e53935;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .cart-item .ci-remove:hover { background: rgba(229,57,53,0.3); }
        .cart-empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }
        .cart-empty i { font-size: 3rem; color: #333; display: block; margin-bottom: 12px; }
        .cart-footer {
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 16px;
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .cart-total .total-amount { color: #ff6b35; font-size: 1.3rem; }
        .order-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff6b35, #e53935);
            border: none;
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .order-btn:hover { transform: scale(1.02); box-shadow: 0 4px 25px rgba(229,57,53,0.3); }
        .order-btn:active { transform: scale(0.97); }
        .order-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .qr-section {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .qr-section .qr-info { flex: 1; }
        .qr-section .qr-info h4 {
            font-size: 0.75rem;
            color: #ff6b35;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .qr-section .qr-info p { font-size: 0.65rem; color: #666; margin-top: 2px; }
        #qrcode {
            background: #fff;
            padding: 6px;
            border-radius: 10px;
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #qrcode img { width: 100% !important; height: 100% !important; }
        .footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255,255,255,0.04);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.6rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .footer i { color: #ff6b35; margin-right: 4px; }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #fff;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; bottom: 110px; }
        
        @media (max-width: 420px) {
            .restaurant-header h1 { font-size: 1.5rem; }
            .item-image { width: 50px; height: 50px; font-size: 1.6rem; }
            #qrcode { width: 70px; height: 70px; }
            .qr-section { flex-direction: column; text-align: center; }
            .cart-panel { max-height: 90vh; padding: 16px 12px 24px; }
            .name-modal { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<!-- ===== İSİM MODAL ===== -->
<div class="name-overlay" id="nameOverlay">
    <div class="name-modal">
        <span class="name-icon">👋</span>
        <h2>Hoş Geldiniz!</h2>
        <p>Sipariş vermek için adınızı girin</p>
        <input type="text" id="userNameInput" placeholder="Adınız" autocomplete="name">
        <div class="name-error" id="nameError">
            <i class="fas fa-exclamation-circle"></i> Lütfen adınızı girin!
        </div>
        <button class="name-btn" onclick="saveName()">
            <i class="fas fa-check"></i> Devam Et
        </button>
    </div>
</div>

<!-- ===== MENÜ İÇERİĞİ ===== -->
<div class="menu-content" id="menuContent">

    <div class="menu-container">

        <div class="restaurant-header">
            <span class="logo">🏫</span>
            <h1>MERKEZ KANTİN</h1>
            <div class="info">
                <i class="fas fa-clock"></i> 08:00 - 18:00
                <i class="fas fa-circle" style="font-size:0.3rem; color:#555;"></i>
                <i class="fas fa-tag"></i> Lezzet Durağı
            </div>
            <div class="user-name" id="userNameDisplay">
                <i class="fas fa-user"></i> <span id="userNameText">İsim girilmedi</span>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
            <div class="badges" style="margin:0;">
                <span><i class="fas fa-utensils"></i> Yemekler</span>
                <span><i class="fas fa-mug-hot"></i> Sıcak İçecek</span>
                <span><i class="fas fa-glass-whiskey"></i> Soğuk İçecek</span>
                <span><i class="fas fa-cake"></i> Tatlı</span>
            </div>
            <div class="cart-top-btn">
                <button onclick="openCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Sepet</span>
                    <span class="cart-count" id="cartCountTop">0</span>
                </button>
            </div>
        </div>

        <div class="category-tabs" id="categoryTabs">
            <button class="category-btn active" data-category="all"><i class="fas fa-th-list"></i> Tümü</button>
            <button class="category-btn" data-category="yemek"><i class="fas fa-utensils"></i> Yemekler</button>
            <button class="category-btn" data-category="sicak-icecek"><i class="fas fa-mug-hot"></i> Sıcak İçecek</button>
            <button class="category-btn" data-category="soguk-icecek"><i class="fas fa-glass-whiskey"></i> Soğuk İçecek</button>
            <button class="category-btn" data-category="tatli"><i class="fas fa-cake"></i> Tatlı</button>
        </div>

        <div class="menu-grid" id="menuGrid"></div>

        <div class="qr-section">
            <div class="qr-info">
                <h4><i class="fas fa-qrcode"></i> QR Menü</h4>
                <p>Telefonla okut, sipariş ver</p>
            </div>
            <div id="qrcode"></div>
        </div>

        <div class="footer">
            <span><i class="fas fa-fire"></i> Taze</span>
            <span><i class="fas fa-credit-card"></i> Kart Kabul</span>
            <span><i class="fas fa-wifi"></i> Wi-Fi</span>
        </div>

    </div>

</div>

<!-- ===== SEPET PANELİ ===== -->
<div class="cart-overlay" id="cartOverlay" onclick="if(event.target===this) closeCart()">
    <div class="cart-panel">
        <div class="cart-header">
            <h2><i class="fas fa-shopping-cart"></i> Sepetim</h2>
            <button class="close-btn" onclick="closeCart()"><i class="fas fa-times"></i></button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Toplam</span>
                <span class="total-amount" id="cartTotal">₺0.00</span>
            </div>
            <button class="order-btn" id="orderBtn" onclick="placeOrder()" disabled>
                <i class="fas fa-check-circle"></i> Sipariş Ver
            </button>
        </div>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<!-- ============================================================ -->
<!-- JAVASCRIPT                                                   -->
<!-- ============================================================ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
// ================================================================
// 🔑 GİTHUB JSON URL
// ================================================================
const FIYAT_URL = "https://raw.githubusercontent.com/duygu35b-source/guzelmenu/refs/heads/main/fiyatlar.json";

// ================================================================
// 📋  MENÜ VERİLERİNİ GİTHUB'DAN ÇEK
// ================================================================
let menuData = [];

async function fetchMenu() {
    try {
        const response = await fetch(FIYAT_URL);
        const data = await response.json();
        menuData = data.menu || [];
        renderMenu('all');
        return menuData;
    } catch (error) {
        console.error('Menü yüklenemedi:', error);
        showToast('⚠️ Menü yüklenemedi. Lütfen sayfayı yenileyin.');
        return [];
    }
}

// ================================================================
// 🖥️  MENÜYÜ GÖSTER
// ================================================================
function renderMenu(category = 'all') {
    const filtered = category === 'all' ? menuData : menuData.filter(item => item.category === category);
    const menuGrid = document.getElementById('menuGrid');
    
    if (filtered.length === 0) {
        menuGrid.innerHTML = `
            <div style="text-align:center; padding:40px 20px; background:rgba(255,255,255,0.02); border-radius:16px;">
                <i class="fas fa-utensils" style="font-size:2rem; color:#555; display:block; margin-bottom:8px;"></i>
                <p style="color:#666; font-size:0.8rem;">Bu kategoride ürün yok</p>
            </div>
        `;
        return;
    }
    
    let html = '';
    filtered.forEach((item, index) => {
        const qty = getCartItemQuantity(item.id);
        html += `
            <div class="menu-item" style="animation-delay: ${(index % 8) * 0.03}s;">
                <div class="item-image">${item.icon || '🍽️'}</div>
                <div class="item-details">
                    <div class="item-name">
                        ${item.name}
                        ${item.badge ? `<span class="badge ${item.badgeType || 'popular'}">${item.badge}</span>` : ''}
                    </div>
                    <div class="item-desc">${item.desc}</div>
                    <div class="item-bottom">
                        <span class="item-price"><span class="currency">₺</span>${item.price}</span>
                        <div style="display:flex; align-items:center; gap:8px;">
                            ${qty > 0 ? `
                                <div class="quantity-controls">
                                    <button onclick="removeFromCart(${item.id})"><i class="fas fa-minus"></i></button>
                                    <span class="qty-number">${qty}</span>
                                    <button onclick="addToCart(${item.id})"><i class="fas fa-plus"></i></button>
                                </div>
                            ` : `
                                <button class="add-btn" data-id="${item.id}" onclick="addToCart(${item.id})">
                                    <i class="fas fa-plus"></i>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            </div>
        `;
    });
    menuGrid.innerHTML = html;
}

// ================================================================
// 👤  İSİM YÖNETİMİ
// ================================================================
let userName = '';

function saveName() {
    const input = document.getElementById('userNameInput');
    const error = document.getElementById('nameError');
    const name = input.value.trim();
    
    if (!name) {
        error.classList.add('show');
        input.style.borderColor = '#e53935';
        setTimeout(() => { input.style.borderColor = 'rgba(255,255,255,0.08)'; }, 2000);
        return;
    }
    
    error.classList.remove('show');
    userName = name;
    document.getElementById('userNameText').textContent = name;
    document.getElementById('userNameDisplay').style.display = 'inline-block';
    
    const overlay = document.getElementById('nameOverlay');
    overlay.style.opacity = '0';
    overlay.style.transition = 'opacity 0.5s ease';
    
    setTimeout(() => {
        overlay.classList.add('hidden');
        document.getElementById('menuContent').classList.add('show');
    }, 500);
    
    localStorage.setItem('kullaniciAdi', name);
    showToast('✅ Hoş geldin, ' + name + '!');
}

window.addEventListener('load', function() {
    const savedName = localStorage.getItem('kullaniciAdi');
    if (savedName) {
        userName = savedName;
        document.getElementById('userNameText').textContent = savedName;
        document.getElementById('userNameDisplay').style.display = 'inline-block';
        document.getElementById('nameOverlay').classList.add('hidden');
        document.getElementById('menuContent').classList.add('show');
    }
    fetchMenu();
});

document.getElementById('userNameInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') saveName();
});

// ================================================================
// 🛒  SEPET İŞLEMLERİ
// ================================================================
let cart = [];

function getCartItemQuantity(productId) {
    const item = cart.find(i => i.id === productId);
    return item ? item.quantity : 0;
}

function addToCart(productId) {
    const product = menuData.find(p => p.id === productId);
    if (!product) return;
    
    if (!userName) {
        document.getElementById('nameOverlay').classList.remove('hidden');
        document.getElementById('nameOverlay').style.opacity = '1';
        showToast('⚠️ Lütfen önce adınızı girin!');
        return;
    }
    
    const existing = cart.find(item => item.id === productId);
    if (existing) {
        existing.quantity += 1;
    } else {
        cart.push({ ...product, quantity: 1 });
    }
    
    updateCartUI();
    showToast(`✅ "${product.name}" sepete eklendi! (${getCartItemQuantity(productId)} adet)`);
    renderMenu(document.querySelector('.category-btn.active')?.getAttribute('data-category') || 'all');
}

function removeFromCart(productId) {
    const existing = cart.find(item => item.id === productId);
    if (!existing) return;
    
    if (existing.quantity > 1) {
        existing.quantity -= 1;
    } else {
        cart = cart.filter(item => item.id !== productId);
    }
    
    updateCartUI();
    renderMenu(document.querySelector('.category-btn.active')?.getAttribute('data-category') || 'all');
}

function deleteFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    updateCartUI();
    renderMenu(document.querySelector('.category-btn.active')?.getAttribute('data-category') || 'all');
}

function updateCartUI() {
    const cartItems = document.getElementById('cartItems');
    const cartTotal = document.getElementById('cartTotal');
    const cartCountTop = document.getElementById('cartCountTop');
    const orderBtn = document.getElementById('orderBtn');
    
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    cartCountTop.textContent = totalItems;
    
    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="cart-empty">
                <i class="fas fa-shopping-bag"></i>
                <p>Sepetiniz boş</p>
                <p style="font-size:0.7rem; color:#444;">Hemen bir şeyler ekleyin!</p>
            </div>
        `;
        cartTotal.textContent = '₺0.00';
        orderBtn.disabled = true;
        return;
    }
    
    let html = '';
    let total = 0;
    cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        html += `
            <div class="cart-item">
                <div class="ci-icon">${item.icon || '🍽️'}</div>
                <div class="ci-info">
                    <div class="ci-name">${item.name}</div>
                    <div class="ci-price">₺${itemTotal.toFixed(2)}</div>
                    <div class="ci-qty-controls">
                        <button onclick="removeFromCart(${item.id})"><i class="fas fa-minus"></i></button>
                        <span class="ci-qty-num">${item.quantity}</span>
                        <button onclick="addToCart(${item.id})"><i class="fas fa-plus"></i></button>
                    </div>
                </div>
                <button class="ci-remove" onclick="deleteFromCart(${item.id})">
                    <i class="fas fa-trash"></i>
                </button>
            </div>
        `;
    });
    
    cartItems.innerHTML = html;
    cartTotal.textContent = `₺${total.toFixed(2)}`;
    orderBtn.disabled = false;
}

// ================================================================
// 📦  SİPARİŞ VER
// ================================================================
function placeOrder() {
    if (cart.length === 0) {
        showToast('⚠️ Sepetiniz boş!');
        return;
    }
    
    if (!userName) {
        document.getElementById('nameOverlay').classList.remove('hidden');
        document.getElementById('nameOverlay').style.opacity = '1';
        showToast('⚠️ Lütfen önce adınızı girin!');
        return;
    }
    
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    
    let orderSummary = '';
    cart.forEach(item => {
        orderSummary += `${item.icon} ${item.name} ×${item.quantity} = ₺${(item.price * item.quantity).toFixed(2)}\n`;
    });
    
    // Sepeti temizle
    cart = [];
    updateCartUI();
    closeCart();
    renderMenu(document.querySelector('.category-btn.active')?.getAttribute('data-category') || 'all');
    
    // Konsola sipariş detayını yaz (sen görebilirsin)
    console.log(`🆕 YENİ SİPARİŞ!`);
    console.log(`👤 Müşteri: ${userName}`);
    console.log(`📦 Ürünler:\n${orderSummary}`);
    console.log(`💰 Toplam: ₺${total.toFixed(2)}`);
    console.log(`━━━━━━━━━━━━━━━━━━━━━━━━━`);
    
    showToast(`✅ Siparişiniz alındı! ${userName}, teşekkürler!`);
}

// ================================================================
// 🛒  SEPET AÇ/KAPA
// ================================================================
function openCart() {
    if (!userName) {
        document.getElementById('nameOverlay').classList.remove('hidden');
        document.getElementById('nameOverlay').style.opacity = '1';
        showToast('⚠️ Lütfen önce adınızı girin!');
        return;
    }
    document.getElementById('cartOverlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    updateCartUI();
}

function closeCart() {
    document.getElementById('cartOverlay').classList.remove('active');
    document.body.style.overflow = '';
}

// ================================================================
// 💬  TOAST
// ================================================================
let toastTimeout;

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

// ================================================================
// 📱  QR KOD
// ================================================================
function generateQR() {
    const container = document.getElementById('qrcode');
    container.innerHTML = '';
    new QRCode(container, {
        text: window.location.href,
        width: 160,
        height: 160,
        colorDark: '#0a0a0a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
    });
}

window.addEventListener('load', generateQR);

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        closeCart();
    }
});

// ================================================================
// 🚀  KATEGORİLER
// ================================================================
const categoryBtns = document.querySelectorAll('.category-btn');

categoryBtns.forEach(btn => {
    btn.addEventListener('click', function() {
        categoryBtns.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderMenu(this.getAttribute('data-category'));
    });
});
</script>
</body>
</html>
